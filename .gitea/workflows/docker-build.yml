name: Build and push VoiceBuilder Docker image (Gitea)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: gitea.lamachere.fr/fabrice/voicebuilder
  BASE_IMAGE: gitea.lamachere.fr/fabrice/voicebuilder-base:cu130

jobs:
  base:
    name: Build and push base image (torch/nvidia)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: gitea.lamachere.fr
          username: ${{ secrets.USER }}
          password: ${{ secrets.TOKEN }}

      # La base (Ubuntu + venv + torch + nvidia + lock) n'est reconstruite que
      # si requirements changent : le cache de registre (voir cache-from/to)
      # renvoie les couches existantes sinon, rendant ce job quasi instantané.
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:cache,mode=max
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            LANG=C.UTF-8
            PYTHONUNBUFFERED=1
            PIP_NO_CACHE_DIR=1

  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.version.outputs.before }}
      new: ${{ steps.version.outputs.new }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          before=$(cat VERSION)
          echo "before=$before" >> "$GITHUB_OUTPUT"

          IFS='.' read -r major minor patch <<< "$before"
          bump_type=patch
          new="$before"

          changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
          commit_subject=$(git log -1 --pretty=%s)

          if echo "$commit_subject" | grep -Eqi 'major|breaking'; then
            bump_type=major
            new="$before"
          elif echo "$changed_files" | grep -Eqi '(web_app|server\.py|Dockerfile|entrypoint|wizard)'; then
            bump_type=minor
            minor=$((minor + 1))
            patch=0
            new="${major}.${minor}.${patch}"
          else
            patch=$((patch + 1))
            new="${major}.${minor}.${patch}"
          fi

          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

  version:
    name: Bump version
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update VERSION
        if: needs.prepare.outputs.before != needs.prepare.outputs.new
        run: |
          echo "${{ needs.prepare.outputs.new }}" > VERSION
          cat VERSION

      - name: Commit and tag
        if: needs.prepare.outputs.before != needs.prepare.outputs.new
        shell: bash
        run: |
          set -e
          if git rev-parse -q --verify "refs/tags/v${{ needs.prepare.outputs.new }}" >/dev/null 2>&1; then
            echo "Tag v${{ needs.prepare.outputs.new }} existe déjà, skip."
            exit 0
          fi
          git config user.name "voicebuilder-ci[bot]"
          git config user.email "voicebuilder-ci@localhost"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ needs.prepare.outputs.new }} [skip ci]"
          git tag "v${{ needs.prepare.outputs.new }}"
          git push origin "HEAD:main"
          git push origin "v${{ needs.prepare.outputs.new }}"

  build:
    name: Build and push Docker image
    needs: [prepare, version, base]
    if: always() && needs.prepare.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: gitea.lamachere.fr
          username: ${{ secrets.USER }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ needs.prepare.outputs.new }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.new }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.BASE_IMAGE }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            LANG=C.UTF-8
            PYTHONUNBUFFERED=1
            PIP_NO_CACHE_DIR=1
            BASE_IMAGE=${{ env.BASE_IMAGE }}

  release:
    name: Create Gitea Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create Gitea Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.new }}
          name: VoiceBuilder v${{ needs.prepare.outputs.new }}
          draft: false
          prerelease: false