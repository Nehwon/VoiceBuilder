# VoiceBuilder — orchestration Docker.
# Tous les dossiers utilisent des volumes Docker nommés (named volumes),
# pas de bind mounts hôte. Les volumes sont créés au premier `docker compose up`.
#
# Ordres :
#   docker compose build
#   docker compose up            # GUI sur http://127.0.0.1:8000
#   docker compose run --rm cli gen_multi_voix texte/x.md -o /app/output/x.wav

# --- Définition des volumes Docker nommés ---
# Chaque service référence ces volumes par leur nom.
# Ils sont déclarés en bas du fichier et créés automatiquement.

# Volume pour les fichiers .wav/.txt des voix.
# L'interface web peut y écrire (import, génération de voix.txt,
# futur outil de création de voix). Début vide, rempli par l'usage.
volume-audio:

# Volume pour le modèle CosyVoice3 (~11 Go).
# Téléchargé automatiquement au premier lancement depuis l'interface,
# ou pré-rempli par un volume externe portant le même nom.
volume-model:

# Volume pour les fichiers texte du projet (.md, .txt).
# La solution d'upload de l'interface y écrit directement.
volume-texte:

# Volume pour la sortie des générations audio (.wav).
volume-output:

# Volume pour les fichiers temporaires (intermédiaires).
volume-tmp:

services:
  # GUI FastAPI — http://127.0.0.1:8000
  gui:
    build: .
    image: voicebuilder:latest
    container_name: voicebuilder-gui
    command: python -m app.server --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VOICEBUILDER_AUDIO_DIR=/data/voice
      - COSYVOICE_MODEL_DIR=/models
      - COSYVOICE_MODEL_SOURCE=${COSYVOICE_MODEL_SOURCE:-modelscope}
    volumes:
      # Dossier des voix : volume DockerNamed, writable, interface y écrit.
      - volume-audio:/data/voice
      # Modèle CosyVoice3 : volume DockerNamed, vide au début, rempli au premier lancement.
      - volume-model:/models
      # Dossier texte : volume DockerNamed, écrit par la solution d'upload.
      - volume-texte:/app/texte
      # Dossier sortie : volume DockerNamed.
      - volume-output:/app/output
      # Dossier temporaire : volume DockerNamed.
      - volume-tmp:/app/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # CLI — génération multi-voix dans le conteneur
  #   docker compose run --rm cli gen_multi_voix texte/x.md -o /app/output/x.wav
  cli:
    build: .
    image: voicebuilder:latest
    profiles: ["cli"]
    command: ["python", "-m", "tools.gen_multi_voix"]
    environment:
      - VOICEBUILDER_AUDIO_DIR=/data/voice
      - COSYVOICE_MODEL_DIR=/models
      - COSYVOICE_MODEL_SOURCE=${COSYVOICE_MODEL_SOURCE:-modelscope}
    volumes:
      # Dossier des voix : volume DockerNamed, writable.
      - volume-audio:/data/voice
      # Modèle CosyVoice3 : volume DockerNamed.
      - volume-model:/models
      # Dossier texte : volume DockerNamed.
      - volume-texte:/app/texte
      # Dossier sortie : volume DockerNamed.
      - volume-output:/app/output
      # Dossier temporaire : volume DockerNamed.
      - volume-tmp:/app/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  volume-audio: {}
  volume-model: {}
  volume-texte: {}
  volume-output: {}
  volume-tmp: {}