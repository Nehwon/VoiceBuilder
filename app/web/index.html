<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceBuilder — éditeur multi-voix</title>
  <link rel="stylesheet" href="/web/style.css" />
  <link rel="stylesheet" href="/web/vendor/codemirror.min.css" />
</head>
<body>
  <header>
    <h1>🎙️ VoiceBuilder</h1>
    <span class="sous-titre">CosyVoice3 · édition multi-voix</span>
    <div class="actions">
      <label for="sel-doc">Document :</label>
      <select id="sel-doc"></select>
      <button id="btn-ouvrir">Ouvrir</button>
      <span id="doc-statut" class="doc-statut"></span>
    </div>
  </header>

  <div id="banniere" class="banniere" hidden>
    <span id="banniere-msg"></span>
    <a id="banniere-lien" href="#reglages">→ Régler le dossier des voix</a>
  </div>

  <main>
    <section class="col-edit">
      <label class="section-title">Texte taggé</label>
      <div id="zone-editeur"></div>
      <div class="editor-preview">
        <label class="section-title">Aperçu du montage</label>
        <audio id="montage" controls></audio>
      </div>
      <pre id="log" class="log"></pre>
      <div class="actions">
        <button id="inserer" class="primaire">Insérer [Nom]:</button>
        <button id="generer" class="primaire">Générer</button>
      </div>
    </section>

    <aside class="col-droite">
      <section>
        <h2>Voix (<span id="n-voix">0</span>)</h2>
        <ul id="liste-voix" class="liste-voix"></ul>
      </section>

      <section id="reglages">
        <h2>Réglages</h2>
        <label>Dossier des voix
          <input id="audio-dir" type="text" />
        </label>
        <button id="btn-dir">Appliquer le dossier</button>

        <div class="grid-reglages">
          <label>Pause (s)<input id="pause" type="number" step="0.05" value="0.5" /></label>
          <label>Vitesse<input id="vitesse" type="number" step="0.05" value="1.0" /></label>
          <label>Max chars<input id="maxchars" type="number" step="1" value="260" /></label>
          <label><input id="verify" type="checkbox" checked /> Vérif Whisper</label>
          <label>Device
            <select id="device">
              <option value="cuda:0">cuda:0</option>
              <option value="cpu">cpu</option>
            </select>
          </label>
        </div>
        <button id="btn-save">Enregistrer réglages</button>
      </section>
    </section>
  </main>

  <script src="/web/vendor/codemirror.min.js"></script>
  <script src="/web/vendor/mode_tagged.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
