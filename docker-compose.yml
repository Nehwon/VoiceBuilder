# VoiceBuilder -- orchestration Docker.
x-image-base: &image-base
  image: ghcr.io/nehwon/voicebuilder-base:cu130
  build:
    context: .
    dockerfile: docker/base/Dockerfile

# GPU : seule la RTX 4070 est autorisee.
# Attention : l'index runtime NVIDIA est inverse de nvidia-smi hote
# (hote 0=4070 / 1=3050, runtime 0=3050 / 1=4070, UUID non fiable).
# Verif : docker exec voicebuilder-gui nvidia-smi -L
x-image-vb: &image-vb
  image: ghcr.io/nehwon/voicebuilder-vb:cu130
  build:
    context: .
    dockerfile: docker/vb/Dockerfile
    args:
      BASE_IMAGE: ghcr.io/nehwon/voicebuilder-base:cu130

services:
  base:
    <<: *image-base
    profiles: ["build"]

  vb:
    <<: *image-vb
    profiles: ["build"]

  gui:
    image: ghcr.io/nehwon/voicebuilder:latest
    container_name: voicebuilder-gui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    command: python -m app.server --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - voicebuilder-models:/app/models
      - voicebuilder-output:/app/output
      - voicebuilder-logs:/app/logs
      - voicebuilder-tmp:/app/tmp
      - /home/fabrice/partages/voice:/app/voix
      - ./voicebuilder_settings.json:/app/voicebuilder_settings.json
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: voicebuilder-ollama
    ports:
      - "11434:11434"
    volumes:
      - volume-ollama:/root/.ollama
    restart: unless-stopped

  cli:
    image: ghcr.io/nehwon/voicebuilder:latest
    profiles: ["cli"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    volumes:
      - voicebuilder-models:/app/models
      - voicebuilder-output:/app/output
      - voicebuilder-logs:/app/logs
      - voicebuilder-tmp:/app/tmp
      - /home/fabrice/partages/voice:/app/voix
    working_dir: /app

volumes:
  voicebuilder-models:
  voicebuilder-output:
  voicebuilder-logs:
  voicebuilder-tmp:
  volume-ollama:
