name: Build base image (torch/CUDA) — hebdomadaire

# Socle système générique (Ubuntu + Python + torch/torchaudio/torchvision/
# torchcodec + nvidia-* cu130). Réutilisable par d'autres projets. Compilé ~1×
# par semaine. Skip automatique si le contenu n'a pas changé (hash -> tag).

on:
  schedule:
    - cron: '0 3 * * 1'   # lundi 03:00
  workflow_dispatch:

env:
  OWNER: fabrice
  BASE_IMAGE: gitea.lamachere.fr/fabrice/voicebuilder-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute content hash
        id: hash
        run: |
          hash=$(sha256sum docker/base/Dockerfile | cut -d' ' -f1 | cut -c1-12)
          echo "tag=cu130-$hash" >> "$GITHUB_OUTPUT"
          echo "Hash du contenu : $hash"

      - name: Skip if already built
        id: skip
        run: |
          if bash scripts/ci/needs_rebuild.sh "${{ env.OWNER }}" voicebuilder-base "${{ steps.hash.outputs.tag }}"; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITEA_URL: https://gitea.lamachere.fr
          GITEA_TOKEN: ${{ secrets.TOKEN }}

      - name: Login to Gitea Container Registry
        if: steps.skip.outputs.build == 'yes'
        uses: docker/login-action@v4
        with:
          registry: gitea.lamachere.fr
          username: ${{ secrets.USER }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push base image
        if: steps.skip.outputs.build == 'yes'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:cu130
            ${{ env.BASE_IMAGE }}:${{ steps.hash.outputs.tag }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:cache,mode=max
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            LANG=C.UTF-8
            PYTHONUNBUFFERED=1
            PIP_NO_CACHE_DIR=1