# VoiceBuilder — orchestration Docker.
# Tous les dossiers utilisent des volumes Docker nommés (named volumes),
# pas de bind mounts hôte. Les volumes sont créés au premier `docker compose up`.
#
# 3 niveaux d'image (cf. docker/base, docker/vb et Dockerfile racine) :
#   base : Ubuntu + Python + torch/CUDA générique (compilée ~1×/semaine)
#   vb   : base + requirements + lock + venv (compilée ~1×/jour)
#   final: vb + code applicatif + patches (à la demande)
#
# Ordres :
#   docker compose build base       # socle torch/CUDA générique (rare)
#   docker compose build vb         # venv + requirements (journalier)
#   docker compose build            # image finale (à la demande)
#   docker compose up               # GUI sur http://127.0.0.1:8000
#   docker compose run --rm cli gen_multi_voix texte/x.md -o /app/output/x.wav

x-image-base: &image-base
  image: gitea.lamachere.fr/fabrice/voicebuilder-base:cu130
  build:
    context: .
    dockerfile: docker/base/Dockerfile

x-image-vb: &image-vb
  image: gitea.lamachere.fr/fabrice/voicebuilder-vb:cu130
  build:
    context: .
    dockerfile: docker/vb/Dockerfile
    args:
      BASE_IMAGE: gitea.lamachere.fr/fabrice/voicebuilder-base:cu130

services:
  # Image de base générique : Ubuntu + Python + torch/CUDA (réutilisable ailleurs).
  # Construite via `docker compose build base` ; jamais lancée par `up`.
  base:
    <<: *image-base
    profiles: ["build"]

  # Image "vb" : pré-requis du projet (venv + requirements + lock).
  # Construite via `docker compose build vb` ; jamais lancée par `up`.
  vb:
    <<: *image-vb
    profiles: ["build"]

  # GUI FastAPI — http://127.0.0.1:8000
  gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VB_IMAGE: gitea.lamachere.fr/fabrice/voicebuilder-vb:cu130
    image: voicebuilder:latest
    container_name: voicebuilder-gui
    command: python -m app.server --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      - VOICEBUILDER_AUDIO_DIR=/data/voice
      - COSYVOICE_MODEL_DIR=/models
      - COSYVOICE_MODEL_SOURCE=${COSYVOICE_MODEL_SOURCE:-modelscope}
      - VOICEBUILDER_ENHANCE_DIR=/models/enhance_models
    volumes:
      # Dossier des voix : volume DockerNamed, writable, interface y écrit.
      - volume-audio:/data/voice
      # Modèle CosyVoice3 : volume DockerNamed, vide au début, rempli au premier lancement.
      - volume-model:/models
      # Dossier texte : volume DockerNamed, écrit par la solution d'upload.
      - volume-texte:/app/texte
      # Dossier sortie : volume DockerNamed.
      - volume-output:/app/output
      # Dossier temporaire : volume DockerNamed.
      - volume-tmp:/app/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # CLI — génération multi-voix dans le conteneur
  #   docker compose run --rm cli gen_multi_voix texte/x.md -o /app/output/x.wav
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VB_IMAGE: gitea.lamachere.fr/fabrice/voicebuilder-vb:cu130
    image: voicebuilder:latest
    profiles: ["cli"]
    command: ["python", "-m", "tools.gen_multi_voix"]
    environment:
      - VOICEBUILDER_AUDIO_DIR=/data/voice
      - COSYVOICE_MODEL_DIR=/models
      - COSYVOICE_MODEL_SOURCE=${COSYVOICE_MODEL_SOURCE:-modelscope}
      - VOICEBUILDER_ENHANCE_DIR=/models/enhance_models
    volumes:
      # Dossier des voix : volume DockerNamed, writable.
      - volume-audio:/data/voice
      # Modèle CosyVoice3 : volume DockerNamed.
      - volume-model:/models
      # Dossier texte : volume DockerNamed.
      - volume-texte:/app/texte
      # Dossier sortie : volume DockerNamed.
      - volume-output:/app/output
      # Dossier temporaire : volume DockerNamed.
      - volume-tmp:/app/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  volume-audio: {}
  volume-model: {}
  volume-texte: {}
  volume-output: {}
  volume-tmp: {}
