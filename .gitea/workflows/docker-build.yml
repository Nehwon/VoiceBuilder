name: Build VoiceBuilder final image (à la demande)

# Image applicative finale : FROM vb + code + patches. Déclenchée par push main
# (à la demande). Skip du build si le code n'a pas changé depuis le dernier tag.
# Le bump de version M.m.f est calculé à chaque push ; le build final référence
# l'image vb stable (cu130) déjà publiée par le workflow journalier.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OWNER: fabrice
  REGISTRY: 192.168.0.5:3000
  IMAGE_NAME: 192.168.0.5:3000/fabrice/voicebuilder
  VB_IMAGE: 192.168.0.5:3000/fabrice/voicebuilder-vb:cu130

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.version.outputs.before }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          before=$(cat VERSION)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          IFS='.' read -r major minor patch <<< "$before"
          bump_type=patch
          new="$before"
          changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
          commit_subject=$(git log -1 --pretty=%s)
          if echo "$commit_subject" | grep -Eqi 'major|breaking'; then
            bump_type=major
            new="$before"
          elif echo "$changed_files" | grep -Eqi '(web_app|server\.py|Dockerfile|entrypoint|wizard)'; then
            bump_type=minor
            minor=$((minor + 1))
            patch=0
            new="${major}.${minor}.${patch}"
          else
            patch=$((patch + 1))
            new="${major}.${minor}.${patch}"
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

  version:
    name: Bump version
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Update VERSION
        if: needs.prepare.outputs.before != needs.prepare.outputs.new
        run: |
          echo "${{ needs.prepare.outputs.new }}" > VERSION
          cat VERSION
      - name: Commit and tag
        if: needs.prepare.outputs.before != needs.prepare.outputs.new
        shell: bash
        run: |
          set -e
          if git rev-parse -q --verify "refs/tags/v${{ needs.prepare.outputs.new }}" >/dev/null 2>&1; then
            echo "Tag v${{ needs.prepare.outputs.new }} existe déjà, skip."
            exit 0
          fi
          git config user.name "voicebuilder-ci[bot]"
          git config user.email "voicebuilder-ci@localhost"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ needs.prepare.outputs.new }} [skip ci]"
          git tag "v${{ needs.prepare.outputs.new }}"
          git push origin "HEAD:main"
          git push origin "v${{ needs.prepare.outputs.new }}"

  build:
    name: Build and push final image
    needs: [prepare, version]
    if: always() && needs.prepare.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute content hash
        id: hash
        run: |
          hash=$(git ls-files -z | xargs -0 sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${{ needs.prepare.outputs.new }}-$hash" >> "$GITHUB_OUTPUT"
          echo "Hash du contenu : $hash"

      - name: Skip if already built
        id: skip
        run: |
          if bash scripts/ci/needs_rebuild.sh "${{ env.OWNER }}" voicebuilder "${{ steps.hash.outputs.tag }}"; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITEA_URL: http://192.168.0.5:3000
          GITEA_TOKEN: ${{ secrets.TOKEN }}

      - name: Login to Gitea Container Registry
        if: steps.skip.outputs.build == 'yes'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push final image
        if: steps.skip.outputs.build == 'yes'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ needs.prepare.outputs.new }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.new }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.VB_IMAGE }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            LANG=C.UTF-8
            PYTHONUNBUFFERED=1
            PIP_NO_CACHE_DIR=1
            VB_IMAGE=${{ env.VB_IMAGE }}

  release:
    name: Create Gitea Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create Gitea Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.new }}
          name: VoiceBuilder v${{ needs.prepare.outputs.new }}
          draft: false
          prerelease: false