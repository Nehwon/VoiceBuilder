name: Build and push VoiceBuilder Docker image (GitHub)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/Nehwon/voicebuilder
  # Version lue depuis le fichier VERSION du workspace au moment du build
  IMAGE_TAG: main

jobs:
  # Job to get current version from VERSION file
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.current_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Read current VERSION
        id: read_version
        run: |
          VERSION=$(cat VERSION)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

  # Job to determine version bump based on changed files
  determine-bump:
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.decide_bump.outputs.bump_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get current version
        id: current_ver
        run: echo "current=${{ needs.get-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Initialize bump type as patch (f)
        id: init_bump
        run: echo "bump_type=f" >> $GITHUB_OUTPUT

      - name: Check for minor (m) changes - new features
        id: check_minor
        run: |
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if echo "$CHANGED_FILES" | grep -qiE "(web_app|server\.py|Dockerfile|entrypoint|wizard)"; then
            echo "minor_detected=true" >> $GITHUB_OUTPUT
          else
            echo "minor_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for major (M) changes - explicit request
        id: check_major
        run: |
          if git log --format="%s" -1 | grep -qi "major\|M version\|breaking"; then
            echo "major_detected=true" >> $GITHUB_OUTPUT
          else
            echo "major_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine bump type
        id: decide_bump
        run: |
          MINOR=${{ steps.check_minor.outputs.minor_detected }}
          MAJOR=${{ steps.check_major.outputs.major_detected }}
          CURRENT=${{ needs.get-version.outputs.version }}
          
          IFS='.' read -ra ADDR <<< "$CURRENT"
          MAJOR_NUM=${ADDR[0]}
          MINOR_NUM=${ADDR[1]}
          PATCH_NUM=${ADDR[2]}
          
          if [ "$MAJOR" = "true" ]; then
            NEW_VERSION="${MAJOR_NUM}.${MINOR_NUM}.${PATCH_NUM}"
            echo "bump_type=M" >> $GITHUB_OUTPUT
          elif [ "$MINOR" = "true" ]; then
            NEW_VERSION="${MAJOR_NUM}.${MINOR_NUM}.0"
            # Minor bump: increment the minor number
            NEW_MINOR=$((MINOR_NUM + 1))
            NEW_VERSION="${MAJOR_NUM}.${NEW_MINOR}.0"
            echo "bump_type=m" >> $GITHUB_OUTPUT
          else
            NEW_PATCH=$((PATCH_NUM + 1))
            NEW_VERSION="${MAJOR_NUM}.${MINOR_NUM}.${NEW_PATCH}"
            echo "bump_type=f" >> $GITHUB_OUTPUT
          fi

  # Job to bump version and update VERSION file
  bump-version:
    needs: determine-bump
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get new version from determine-bump
        id: new_ver
        run: echo "new=${{ needs.determine-bump.outputs.new_version }}" >> $GITHUB_OUTPUT

      - name: Update VERSION file
        run: |
          echo "${{ env.VERSION_NEW }}" > VERSION
          cat VERSION

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ needs.determine-bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Print new version
        run: |
          echo "New version: ${{ needs.determine-bump.outputs.new_version }}"

  # Job to build and push Docker image
  build:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            LANG=C.UTF-8
            PYTHONUNBUFFERED=1
            PIP_NO_CACHE_DIR=1

  # Optional: Create GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Read VERSION file
        id: read_version
        run: |
          VERSION=$(cat ${{ github.workspace }}/VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          name: VoiceBuilder v${{ steps.read_version.outputs.version }} release
          
          draft: false
          prerelease: false